<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Odysseum</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#161b22">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- Accueil -->
  <main id="home" class="screen home">
    <!-- L'archipel en 3D (repli : grille d'icônes si WebGL indisponible) -->
    <div id="world" class="world" aria-label="Archipel"></div>
    <h1 class="title" aria-label="Odysseum">odysseum</h1>

    <!-- niveau du joueur : ouvre la carte du cerveau -->
    <button id="open-brain" class="ghost-icon corner corner-left level-badge" aria-label="Niveau du joueur">
      <svg viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="23" stroke="var(--line)" stroke-width="2"/>
        <circle id="level-ring" cx="26" cy="26" r="23" stroke="var(--p2)" stroke-width="2" stroke-dasharray="144.5" stroke-dashoffset="144.5"/>
      </svg>
      <span id="level-num">1</span>
    </button>
    <button id="open-settings" class="ghost-icon corner" aria-label="Réglages">
      <svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
    </button>
    <button id="open-library" class="ghost-icon corner corner-2" aria-label="Liste des mini-jeux">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
    </button>

    <!-- caméra libre : survoler la carte ; un nouvel appui recentre sur Ulysse -->
    <button id="cam-mode" class="ghost-icon cam-btn" aria-label="Caméra libre" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><path d="M12 3l-2 2M12 3l2 2M12 21l-2-2M12 21l2-2M3 12l2-2M3 12l2 2M21 12l-2-2M21 12l-2 2"/><circle cx="12" cy="12" r="2.2"/></svg>
    </button>
    <!-- un seul bouton : le mini-jeu qui attend sur la pierre choisie -->
    <button id="go" class="go" aria-label="Jouer"></button>
  </main>

  <!-- Partie -->
  <main id="play" class="screen" hidden>
    <header class="topbar">
      <button id="back" class="ghost-icon" aria-label="Retour">
        <svg viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></svg>
      </button>
      <!-- en-tête : le niveau, puis le mini-jeu, puis l'étape de la série -->
      <div class="play-mid">
        <span id="play-level" class="play-level"></span>
        <span class="play-title">
          <span id="play-icon" class="play-icon" aria-hidden="true"></span>
          <span id="play-name" class="play-name"></span>
        </span>
        <span id="steps" class="steps" hidden></span>
      </div>
      <button id="btn-rules" class="ghost-icon" aria-label="Règles">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.8 9.6a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.6" r=".4"/></svg>
      </button>
    </header>

    <div id="tools" class="tools" hidden></div>
    <div id="board" class="board"></div>

    <nav class="actions">
      <button id="btn-undo" class="ghost-icon" aria-label="Annuler">
        <svg viewBox="0 0 24 24"><path d="M9 8 5 12l4 4"/><path d="M5 12h9a5 5 0 0 1 0 10"/></svg>
      </button>
      <button id="btn-reset" class="ghost-icon" aria-label="Effacer">
        <svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-4.9"/><path d="M5 4v4h4"/></svg>
      </button>
      <button id="btn-hint" class="ghost-icon" aria-label="Indice">
        <svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M6 6l1.4 1.4M16.6 16.6 18 18M6 18l1.4-1.4M16.6 7.4 18 6"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </nav>

    <!-- TEMPORAIRE : outil de test pour avancer vite -->
    <button id="btn-autosolve" class="autosolve">autosolve</button>

    <div id="win" class="calm" hidden>
      <div class="calm-inner">
        <div class="bloom" aria-hidden="true"></div>
        <div class="calm-actions">
          <button id="win-next" class="next-btn" aria-label="Continuer le voyage">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="rules" class="overlay" hidden>
    <!-- tutoriel illustré : une page = un dessin + une phrase -->
    <div class="sheet tuto-sheet">
      <span id="rules-icon" class="rules-icon" aria-hidden="true"></span>
      <div id="tuto-art" class="tuto-art-wrap"></div>
      <p id="tuto-text" class="tuto-text"></p>
      <div id="tuto-dots" class="tuto-dots"></div>
      <button id="rules-close" class="next-btn" aria-label="Suivant">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <!-- liste des mini-jeux, en jeu libre -->
  <div id="library" class="overlay library" hidden>
    <div class="sheet">
      <div class="switch-mode lib-mode" role="tablist" aria-label="Règles">
        <button class="on" data-mode="classic" role="tab">classique</button>
        <button data-mode="variant" role="tab">variante</button>
      </div>
      <div id="game-list" class="game-grid"></div>
    </div>
  </div>

  <!-- carte du cerveau : les facultés qui se développent -->
  <div id="brain" class="overlay" hidden>
    <div class="sheet brain-sheet">
      <!-- bandeau du niveau global : un toucher affiche le niveau de chaque mini-jeu -->
      <button id="brain-band" class="level-band" aria-expanded="false">
        <span class="lb-label">niveau <b id="brain-level">1</b></span>
        <span class="lb-bar"><i id="brain-xp-bar"></i></span>
        <small id="brain-xp">0 / 100</small>
      </button>
      <div id="games-detail" class="games-detail" hidden></div>
      <div class="brain-wrap">
        <button id="brain-back" class="ghost-icon brain-back" aria-label="Vue d'ensemble" hidden>
          <svg viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></svg>
        </button>
        <svg id="brain-svg" class="brain" viewBox="0 0 320 250" role="img" aria-label="Carte du cerveau"></svg>
      </div>
      <div id="skills" class="skills"></div>
      <!-- zone choisie : ses mini-jeux et le mode concentration -->
      <div id="zone-panel" class="zone-panel" hidden></div>
    </div>
  </div>

  <div id="settings" class="overlay" hidden>
    <div class="sheet">
      <div class="theme-row">
        <span>Thème</span>
        <div class="switch-mode theme-mode" role="tablist" aria-label="Thème">
          <button data-theme-choice="auto" role="tab">auto</button>
          <button data-theme-choice="light" role="tab">clair</button>
          <button data-theme-choice="dark" role="tab">sombre</button>
        </div>
      </div>
      <label class="toggle"><span>Sons</span><input type="checkbox" id="opt-sound"><i></i></label>
      <label class="toggle"><span>Musique</span><input type="checkbox" id="opt-music"><i></i></label>
      <div class="mix">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/></svg>
        <input type="range" id="opt-mix" min="0" max="100" step="1" value="50" aria-label="Équilibre entre sons et musique">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V6l10-2v11"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="15" r="2"/></svg>
      </div>
      <label class="toggle"><span>Vibrations</span><input type="checkbox" id="opt-vibrate"><i></i></label>
      <p class="sheet-label">Accessibilité</p>
      <label class="toggle"><span>Texte agrandi</span><input type="checkbox" class="opt-a11y" data-a11y="text"><i></i></label>
      <label class="toggle"><span>Contraste renforcé</span><input type="checkbox" class="opt-a11y" data-a11y="contrast"><i></i></label>
      <label class="toggle"><span>Animations réduites</span><input type="checkbox" class="opt-a11y" data-a11y="motion"><i></i></label>
      <label class="toggle"><span>Symboles sur les couleurs</span><input type="checkbox" class="opt-a11y" data-a11y="cb"><i></i></label>
    </div>
  </div>

  <!-- fin de niveau : XP gagnée par capacité, puis retour sur la carte -->
  <div id="level-done" class="overlay level-done" hidden>
    <div class="sheet">
      <p id="ld-title" class="ld-title">Niveau</p>
      <div id="ld-skills" class="ld-skills"></div>
      <button id="ld-next" class="next-btn" aria-label="Niveau suivant">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
  <!-- gain d'expérience après une victoire -->
  <div id="xp-toast" class="xp-toast" aria-live="polite" hidden></div>
  <!-- fondu lumineux du mode concentration -->
  <div id="flash" class="flash" hidden></div>
</div>

<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/games/flux.js"></script>
<script src="js/games/reines.js"></script>
<script src="js/games/astres.js"></script>
<script src="js/games/paves.js"></script>
<script src="js/games/pixels.js"></script>
<script src="js/games/serpent.js"></script>
<script src="js/games/lumieres.js"></script>
<script src="js/games/coffre.js"></script>
<script src="js/games/tuyaux.js"></script>
<script src="js/tutorials.js"></script>
<script src="js/world.js"></script>
<script src="js/app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icône Odysseus : le petit navire grec d'Ulysse, voile carrée bombée, devant un soleil d'aube sur une mer calme.
       Scène pleine page (premier plan des icônes adaptatives Android) : le sujet tient dans le cercle central de 61 %.
       Rendu des PNG : tools/render_icons.py (resvg). Le même dessin de navire est repris dans l'intro (index.html). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3e6"/>
      <stop offset=".62" stop-color="#f9dcc3"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="640" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9fd6cb"/>
      <stop offset="1" stop-color="#4d9fa6"/>
    </linearGradient>
    <clipPath id="sailClip">
      <path d="M372 306Q512 286 652 306C692 420 684 522 640 592Q512 618 384 592C340 522 332 420 372 306Z"/>
    </clipPath>
  </defs>

  <!-- ciel d'aube, soleil posé sur l'horizon -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="512" cy="470" r="296" fill="#fbe2c2"/>
  <circle cx="512" cy="470" r="236" fill="#ffcf86"/>
  <!-- mer calme -->
  <rect y="640" width="1024" height="384" fill="url(#sea)"/>
  <path d="M0 640H1024" stroke="#c8e8de" stroke-width="10"/>

  <!-- goéland -->
  <path d="M196 268q30-30 60 0q30-30 60 0" fill="none" stroke="#4a3b57" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- le navire -->
  <g stroke="#4a3b57" stroke-linecap="round" stroke-linejoin="round">
    <!-- mât et fanion -->
    <path d="M512 228V610" stroke-width="26"/>
    <path d="M512 222L580 242L512 262Z" fill="#ef8a6a" stroke-width="16"/>
    <!-- voile carrée bombée -->
    <path d="M372 306Q512 286 652 306C692 420 684 522 640 592Q512 618 384 592C340 522 332 420 372 306Z" fill="#fffaf0" stroke="none"/>
    <g clip-path="url(#sailClip)" stroke="none">
      <rect x="474" y="280" width="76" height="340" fill="#f4a47f"/>
      <ellipse cx="700" cy="460" rx="120" ry="220" fill="#f1e1cb" opacity=".8"/>
      <path d="M404 340C392 400 392 470 406 540" fill="none" stroke="#ffffff" stroke-width="18" opacity=".9"/>
    </g>
    <path d="M372 306Q512 286 652 306C692 420 684 522 640 592Q512 618 384 592C340 522 332 420 372 306Z" fill="none" stroke-width="26"/>
    <!-- vergue -->
    <path d="M344 302Q512 280 680 302" fill="none" stroke-width="28"/>
    <!-- poupe recourbée (à gauche) et proue (à droite) : trait encre puis trait terre cuite -->
    <path d="M292 604C262 556 268 504 306 496C336 490 346 528 318 534" fill="none" stroke-width="58"/>
    <path d="M292 604C262 556 268 504 306 496C336 490 346 528 318 534" fill="none" stroke="#d9774f" stroke-width="28"/>
    <path d="M752 604C774 584 790 562 800 532" fill="none" stroke-width="58"/>
    <path d="M752 604C774 584 790 562 800 532" fill="none" stroke="#d9774f" stroke-width="28"/>
    <!-- coque -->
    <path d="M268 598H776C760 670 700 710 612 710H430C340 710 286 670 268 598Z" fill="#d9774f" stroke-width="26"/>
    <path d="M312 662H730" fill="none" stroke="#fff3e2" stroke-width="16"/>
    <!-- l'oeil de proue -->
    <circle cx="714" cy="626" r="14" fill="#fff3e2" stroke-width="8"/>
  </g>

  <!-- vague de devant : elle lèche le bas de la coque -->
  <path d="M-64 690q64-40 128 0t128 0t128 0t128 0t128 0t128 0t128 0t128 0t128 0V1024H-64Z" fill="#6fbab6"/>
  <path d="M-64 690q64-40 128 0t128 0t128 0t128 0t128 0t128 0t128 0t128 0t128 0" fill="none" stroke="#fff3e2" stroke-width="22" stroke-linecap="round"/>
  <!-- reflets du soleil sur l'eau -->
  <g stroke="#fff3e2" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M440 790H584" stroke-width="18"/>
    <path d="M466 852H558" stroke-width="16"/>
    <path d="M490 908H534" stroke-width="14"/>
  </g>
</svg>
